{{- /*
  This is a DEV/TEST-ONLY convenience Secret. In production, `db-credentials`
  should instead be created by the AWS Secrets & Config Provider (ASCP) via
  a SecretProviderClass + the Secrets Store CSI Driver, syncing directly
  from the AWS Secrets Manager secret provisioned by Terraform
  (module.secrets). See README.md "Secrets wiring" for setup steps.

  Enable only for local/dev testing with `--set devSecretStub.enabled=true`.
*/ -}}
{{- if .Values.devSecretStub.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_HOST: {{ .Values.devSecretStub.dbHost | quote }}
  DB_PORT: {{ .Values.devSecretStub.dbPort | quote }}
  DB_NAME: {{ .Values.devSecretStub.dbName | quote }}
  DB_USER: {{ .Values.devSecretStub.dbUser | quote }}
  DB_PASSWORD: {{ .Values.devSecretStub.dbPassword | quote }}
{{- end }}
